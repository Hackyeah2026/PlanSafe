---
name: Mikrus checks and deploy

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # setup-dotnet v4.3.1
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: "10.0.201"
      # setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: dotnet workload install wasm-tools
      - run: bash infra/ci/check.sh

  package:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # setup-dotnet v4.3.1
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: "10.0.201"
      # setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - run: dotnet workload install wasm-tools
      - run: npm ci
      - run: bash infra/ci/package.sh
      - run: bash infra/ci/smoke.sh
      # upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mikrus-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/release.tar.gz
            artifacts/deploy-bundle.tar.gz
            artifacts/worker-validation.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: mikrus
    concurrency:
      group: plansafe-mikrus-deploy
      cancel-in-progress: false
    steps:
      # checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mikrus-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - name: Skip stale main, upload and activate
        env:
          GH_TOKEN: ${{ github.token }}
          MIKRUS_HOST: ${{ vars.MIKRUS_HOST }}
          MIKRUS_SSH_PORT: ${{ vars.MIKRUS_SSH_PORT }}
          MIKRUS_KEY: ${{ secrets.MIKRUS_KEY }}
          MIKRUS_KNOWN_HOSTS: ${{ secrets.MIKRUS_KNOWN_HOSTS }}
          RELEASE_ID: >-
            ${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq '.object.sha')
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo 'Skipping superseded main commit'
            exit 0
          fi
          bash infra/ci/upload.sh
