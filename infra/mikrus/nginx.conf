server {
    listen @HTTP_PORT@ default_server;
    listen [::]:@HTTP_PORT@ default_server;
    server_name _;
    root /srv/plansafe/current/web;
    index index.html;
    server_tokens off;
    access_log off;
    error_log syslog:server=unix:/dev/log warn;

    # nginx static validators permit body-free 304 responses on repeat visits.
    etag on;
    if_modified_since exact;
    gzip_vary on;

    location = /api { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    # Keep the policy on static locations only, not on proxied API responses.
    # Private prevents the public proxy from assigning its four-hour cache TTL.
    # Browsers can still revalidate unchanged files with nginx's ETag.
    location /_framework/ {
        add_header Cache-Control "private, no-cache" always;
        try_files $uri =404;
    }
    location /js/ {
        add_header Cache-Control "private, no-cache" always;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location / {
        add_header Cache-Control "private, no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
