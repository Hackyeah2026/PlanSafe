<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plan Safe</title>
    <base href="/" />
    <script type="importmap"></script>
    <script src="js/appearance.js"></script>
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="lib/leaflet/leaflet.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/design-tokens.css" />
    <link rel="stylesheet" href="css/controls.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="PlanSafe.App.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <script src="lib/leaflet/leaflet.js"></script>
    <script>
      // Geolocation helper for citizen mobile view
      window.getGeolocation = function () {
        return new Promise(function (resolve) {
          var isLocalhost =
            window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1" ||
            window.location.hostname === "::1";
          var isHttps = window.location.protocol === "https:";
          var isSecure =
            typeof window.isSecureContext !== "undefined"
              ? window.isSecureContext
              : isHttps || isLocalhost;

          if (!isSecure && !isLocalhost) {
            resolve({
              success: false,
              isSecureContext: false,
              code: "INSECURE_CONTEXT",
              message:
                "Location blocked: the connection to " +
                window.location.origin +
                " is unencrypted (HTTP). The W3C standard requires HTTPS or localhost.",
            });
            return;
          }

          if (!navigator.geolocation) {
            resolve({
              success: false,
              isSecureContext: isSecure,
              code: "NOT_SUPPORTED",
              message: "The browser does not support GPS geolocation.",
            });
            return;
          }

          navigator.geolocation.getCurrentPosition(
            function (pos) {
              resolve({
                success: true,
                isSecureContext: isSecure,
                latitude: pos.coords.latitude,
                longitude: pos.coords.longitude,
                accuracy: pos.coords.accuracy,
                code: "OK",
                message: "GPS location retrieved.",
              });
            },
            function (err) {
              if (err.code === 1) {
                resolve({
                  success: false,
                  isSecureContext: isSecure,
                  code: "PERMISSION_DENIED",
                  message: "Location access denied in browser permissions.",
                });
                return;
              }

              navigator.geolocation.getCurrentPosition(
                function (pos2) {
                  resolve({
                    success: true,
                    isSecureContext: isSecure,
                    latitude: pos2.coords.latitude,
                    longitude: pos2.coords.longitude,
                    accuracy: pos2.coords.accuracy,
                    code: "OK",
                    message: "Location retrieved via network/Wi-Fi.",
                  });
                },
                function (err2) {
                  var reason =
                    err2.code === 1
                      ? "Location access denied."
                      : err2.code === 2
                        ? "Location unavailable (no GPS/network signal)."
                        : err2.code === 3
                          ? "GPS request timed out."
                          : "GPS error.";
                  resolve({
                    success: false,
                    isSecureContext: isSecure,
                    code:
                      err2.code === 1
                        ? "PERMISSION_DENIED"
                        : err2.code === 2
                          ? "POSITION_UNAVAILABLE"
                          : "TIMEOUT",
                    message: reason,
                  });
                },
                {
                  enableHighAccuracy: false,
                  timeout: 10000,
                  maximumAge: 60000,
                },
              );
            },
            { enableHighAccuracy: true, timeout: 6000, maximumAge: 30000 },
          );
        });
      };

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          for (const reg of regs) reg.unregister();
        });
      }
      // Preserve the runtime's boot resource cache
    </script>
  </head>

  <body>
    <div id="app">
      <svg class="loading-progress">
        <circle r="40%" cx="50%" cy="50%" />
        <circle r="40%" cx="50%" cy="50%" />
      </svg>
      <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
      An unhandled error has occurred.
      <a href="." class="reload">Reload</a>
      <button type="button" class="dismiss" aria-label="Dismiss error">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M6 6l12 12M6 18L18 6" />
        </svg>
      </button>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
